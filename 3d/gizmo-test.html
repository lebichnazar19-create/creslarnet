<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Creslarnet — тест гізмо (TransformControls)</title>
<meta name="theme-color" content="#8338ec">
<!--
  A deliberately bare test page for the gizmo ALONE: a grid, one cube, the
  stock three.js TransformControls on it and OrbitControls for the camera.
  No flight controls, no joystick, no tools — and not a single pointer or
  touch handler of our own that could act on anything: the only listeners
  this page adds to the canvas just WRITE DOWN what happened, for the debug
  readout. If the gizmo misbehaves here, it's the controls or the browser;
  if it behaves, the main app's own touch handling was the problem.

  Units are millimetres, as everywhere in the app: the cube is 1000 mm.
-->
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #0d0d0f;
    color: #f4f2f8;
    font-family: "Public Sans", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none; /* every touch goes to the page's controls — the browser neither scrolls nor zooms */
  }
  #debug {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    z-index: 5;
    margin: 0;
    padding: 6px 10px 7px;
    background: rgba(0, 0, 0, 0.78);
    border-bottom: 1px solid rgba(57, 255, 122, 0.45);
    color: #39ff7a;
    font: 12px/1.4 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    pointer-events: none; /* never in the way of a touch */
  }
  #modes {
    position: fixed;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 6px;
    padding: 5px;
    max-width: calc(100vw - 12px);
    background: rgba(20, 18, 26, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
  }
  #modes button {
    border: none;
    border-radius: 11px;
    padding: 11px 13px;
    background: #262330;
    color: #f4f2f8;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  #modes button.on { background: #8338ec; color: #fff; }
  #modes button.plain { background: transparent; color: #b3aec0; padding-left: 9px; padding-right: 9px; }
  #reportBox {
    position: fixed;
    left: 8px;
    right: 8px;
    top: 22%;
    height: 46%;
    z-index: 9;
    background: #111;
    color: #39ff7a;
    border: 1px solid #39ff7a;
    border-radius: 8px;
    font: 11px/1.35 ui-monospace, monospace;
    padding: 8px;
  }
</style>
<script>
  // Runs before anything else, as a plain (non-module) script, so that even
  // if the page's real script never starts — the browser can't do import
  // maps, a file didn't load, a script threw — the reason is written on the
  // screen instead of the page just sitting there doing nothing.
  window.__errors = [];
  window.__showError = function (text) {
    window.__errors.push(String(text));
    var el = document.getElementById('debug');
    if (el && !window.__gizmoTest) el.textContent = 'ПОМИЛКА: ' + window.__errors.join('\n');
  };
  window.addEventListener('error', function (e) {
    var where = e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : (e.target && e.target.src ? ' @ ' + e.target.src : '');
    window.__showError((e.message || 'не завантажився файл') + where);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    window.__showError('promise: ' + ((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (!window.__gizmoTest) window.__showError('скрипт сторінки не запустився за 6 с — браузер не підтримує import map або не завантажив файли three.js');
  }, 6000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
  <canvas id="view"></canvas>
  <pre id="debug">завантаження…</pre>
  <div id="modes">
    <button data-mode="translate" class="on">Рух</button>
    <button data-mode="rotate">Обертання</button>
    <button data-mode="scale">Масштаб</button>
    <button id="reset" class="plain">Скинути</button>
    <button id="report" class="plain">📋 Звіт</button>
  </div>
  <!-- Shown only if copying to the clipboard isn't allowed: the report as
       text to select and copy by hand. -->
  <textarea id="reportBox" readonly hidden></textarea>

<script type="module">
import * as THREE from 'three';
import { TransformControls } from './vendor/three/TransformControls.js';
import { OrbitControls } from './vendor/three/OrbitControls.js';

const canvas = document.getElementById('view');
const debugEl = document.getElementById('debug');

// ---- scene: grid + one cube (mm) -------------------------------------------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0f);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 10, 200000);
camera.position.set(3200, 2800, 4200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a63, 1.0));
const sun = new THREE.DirectionalLight(0xfff3e0, 1.4);
sun.position.set(6000, 9000, 4000);
scene.add(sun);
scene.add(new THREE.GridHelper(10000, 20, 0x8a8a92, 0x3a3a42)); // 10 m across, 500 mm cells

const CUBE_START = new THREE.Vector3(0, 500, 0); // standing on the grid
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1000, 1000, 1000),
  new THREE.MeshStandardMaterial({ color: 0xcfcfd6, roughness: 0.75, metalness: 0.05 }),
);
cube.position.copy(CUBE_START);
scene.add(cube);

// ---- the gizmo: stock TransformControls -------------------------------------
// Created BEFORE OrbitControls on purpose: listeners on one element run in
// the order they were added, so on a touch the gizmo looks first, and if it
// took the touch its 'dragging-changed' has already switched the camera
// controls off by the time OrbitControls gets the very same event — the
// orbit never even starts.
const gizmo = new TransformControls(camera, canvas);
gizmo.setSize(1.35);                 // a little larger than default: handles sized for a fingertip
gizmo.setSpace('world');
gizmo.setTranslationSnap(1);         // whole millimetres
gizmo.setRotationSnap(THREE.MathUtils.degToRad(1));
gizmo.setScaleSnap(0.01);
gizmo.attach(cube);
scene.add(gizmo);

// One fix on top of the stock control, for TOUCH. TransformControls measures
// a drag on a helper plane that it turns to suit the axis being dragged —
// but it only re-turns that plane when a frame is rendered. With a mouse
// that's fine: the pointer hovers over an arrow (plane turned, frames pass)
// long before the button goes down. A finger has no hover: "which axis" and
// "drag starts here" happen inside one and the same pointerdown, so the
// start point gets measured on the plane as it was turned for NO axis, the
// next frame turns the plane, and the first movement is measured on a
// different plane — the object leaps along the axis (hundreds of mm at this
// scale) from a 1 px move. Bringing the plane up to date before the stock
// pointerDown runs removes that leap entirely.
// Axes only. The stock gizmo also carries handles that are NOT one axis:
// squares that slide in a plane (XY/YZ/XZ), a centre handle that moves or
// scales freely, and in rotate mode a free-rotate ball plus a big outer
// "turn about the view" ring that on a phone held upright spans the whole
// width of the screen. Any of those under a fingertip would break the one
// thing this page is here to prove — a touch on an arrow moves along that
// arrow's axis and nothing else — so they're taken off, both the drawn
// handle and its (invisible) touch target.
for (const mode of ['translate', 'rotate', 'scale']) {
  for (const group of [gizmo._gizmo.gizmo[mode], gizmo._gizmo.picker[mode]]) {
    for (const child of [...group.children]) if (!['X', 'Y', 'Z'].includes(child.name)) group.remove(child);
  }
}

const stockPointerDown = gizmo.pointerDown.bind(gizmo);
gizmo.pointerDown = (pointer) => {
  gizmo._plane.updateMatrixWorld(true);
  stockPointerDown(pointer);
};

const orbit = new OrbitControls(camera, canvas);
orbit.target.set(0, 500, 0);
orbit.update();

gizmo.addEventListener('dragging-changed', (e) => {
  orbit.enabled = !e.value; // while the gizmo is being dragged the camera does not move
  if (e.value) touchStart.copy(cube.position);
  note(e.value ? 'dragging-changed: тягне' : 'dragging-changed: відпущено');
});

// ---- mode buttons -------------------------------------------------------------
const MODE_NAMES = { translate: 'рух', rotate: 'обертання', scale: 'масштаб' };
const modeButtons = [...document.querySelectorAll('#modes button[data-mode]')];
for (const btn of modeButtons) {
  btn.addEventListener('click', () => {
    gizmo.setMode(btn.dataset.mode);
    for (const b of modeButtons) b.classList.toggle('on', b === btn);
  });
}
document.getElementById('reset').addEventListener('click', () => {
  cube.position.copy(CUBE_START);
  cube.rotation.set(0, 0, 0);
  cube.scale.set(1, 1, 1);
  touchStart.copy(cube.position);
});

// ---- debug readout ------------------------------------------------------------
// These listeners only record what the browser delivered. Capture phase, so
// they see an event before either control does, and nothing here ever calls
// preventDefault / stopPropagation or touches the scene.
let lastEvent = '—', eventCount = 0, lastNote = '';
const touchStart = cube.position.clone(); // where the cube was when the current/last drag began
const history = [];        // the last events, one line each — for the report
const counts = {};         // how many of each event type reached the canvas
const t0 = performance.now();
function record(line) {
  history.push(`${((performance.now() - t0) / 1000).toFixed(2)}s ${line}`);
  if (history.length > 40) history.shift();
}
function note(text) { lastNote = text; record(text); }
let movesSinceDown = 0;
for (const type of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'lostpointercapture', 'gotpointercapture']) {
  canvas.addEventListener(type, (e) => {
    eventCount++;
    counts[type] = (counts[type] || 0) + 1;
    lastEvent = `${type} (${e.pointerType || '?'}, палець ${e.pointerId})`;
    if (type === 'pointerdown') { touchStart.copy(cube.position); movesSinceDown = 0; }
    // every event goes in the history except the flood of moves: of those, the first three after a touch-down and then every 15th
    if (type === 'pointermove' && ++movesSinceDown > 3 && movesSinceDown % 15) return;
    record(`${type} ${e.pointerType || '?'}#${e.pointerId} btn=${e.button} xy=${Math.round(e.clientX)},${Math.round(e.clientY)}`);
    // What the gizmo made of it is only known once ITS handler has run, and
    // this listener runs first — so look again once the event is fully
    // dealt with (a timeout, not a microtask: microtasks run between two
    // listeners of the same event, i.e. still before the gizmo's).
    if (type !== 'pointermove') setTimeout(() => record(`  → вісь ${gizmo.axis || 'жодна'}, тягне ${gizmo.dragging ? 'так' : 'ні'}, куб ${mm(cube.position.x)} ${mm(cube.position.y)} ${mm(cube.position.z)}`), 0);
  }, true);
}
// A touch the canvas never got (something else was on top of it) shows up here only.
window.addEventListener('pointerdown', (e) => {
  if (e.target !== canvas) record(`pointerdown НЕ на полотні: <${(e.target.tagName || '?').toLowerCase()}${e.target.id ? '#' + e.target.id : ''}>`);
}, true);

// Everything worth knowing about this device and what just happened, as text.
function buildReport() {
  let gpu = '?';
  try {
    const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
    gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  } catch (err) { gpu = `(${err.message})`; }
  const r = canvas.getBoundingClientRect();
  return [
    'ЗВІТ ТЕСТУ ГІЗМО',
    `браузер: ${navigator.userAgent}`,
    `екран: ${window.innerWidth}×${window.innerHeight} css px, dpr ${window.devicePixelRatio}, полотно ${Math.round(r.width)}×${Math.round(r.height)} @ ${Math.round(r.left)},${Math.round(r.top)}, буфер ${canvas.width}×${canvas.height}`,
    `three r${THREE.REVISION}, GPU: ${gpu}`,
    `touch-action: ${window.getComputedStyle ? window.getComputedStyle(canvas).touchAction : canvas.style.touchAction}, maxTouchPoints ${navigator.maxTouchPoints}`,
    `режим: ${gizmo.mode}, вісь: ${gizmo.axis || 'жодна'}, тягне: ${gizmo.dragging}, камера ввімкнена: ${orbit.enabled}`,
    `куб: ${mm(cube.position.x)} ${mm(cube.position.y)} ${mm(cube.position.z)} мм, поворот ${deg(cube.rotation.x)} ${deg(cube.rotation.y)} ${deg(cube.rotation.z)}°, масштаб ${cube.scale.x.toFixed(2)} ${cube.scale.y.toFixed(2)} ${cube.scale.z.toFixed(2)}`,
    `подій на полотні: ${Object.keys(counts).map((k) => `${k} ${counts[k]}`).join(', ') || 'жодної'}`,
    `помилки: ${window.__errors.length ? window.__errors.join(' | ') : 'немає'}`,
    'останні події:',
    ...history,
  ].join('\n');
}

// "📋 Звіт": the report to the clipboard, ready to paste into a message.
const reportBox = document.getElementById('reportBox');
const reportBtn = document.getElementById('report');
reportBtn.addEventListener('click', async () => {
  const text = buildReport();
  if (!reportBox.hidden) { reportBox.hidden = true; return; }
  try {
    await navigator.clipboard.writeText(text);
    reportBtn.textContent = '✓ Скопійовано';
    setTimeout(() => { reportBtn.textContent = '📋 Звіт'; }, 1800);
  } catch (err) {
    reportBox.value = text; // clipboard not allowed here — show it to be copied by hand
    reportBox.hidden = false;
    reportBox.focus();
    reportBox.select();
  }
});

// Opened from this phone's own local server (127.0.0.1) rather than from the
// public site, the page also sends the report back to that server after
// every touch — so whoever is debugging sees what the phone saw without
// anything having to be copied at all. On the public site this does nothing.
const LOCAL = ['127.0.0.1', 'localhost'].includes(window.location.hostname);
function sendReport(why) {
  if (!LOCAL) return;
  fetch('/log', { method: 'POST', keepalive: true, body: `--- ${why} ---\n${buildReport()}\n` }).catch(() => {});
}
canvas.addEventListener('pointerup', () => setTimeout(() => sendReport('після дотику'), 60));
canvas.addEventListener('pointercancel', () => setTimeout(() => sendReport('після pointercancel'), 60));
setTimeout(() => sendReport('сторінку відкрито'), 800);

const mm = (v) => (Math.round(v * 10) / 10).toString().replace('.', ',');
const deg = (r) => Math.round(THREE.MathUtils.radToDeg(r));
function renderDebug() {
  const p = cube.position, r = cube.rotation, s = cube.scale;
  const axis = gizmo.axis ? gizmo.axis : 'жодна';
  debugEl.textContent =
    `подія ${eventCount}: ${lastEvent}\n` +
    `вісь: ${axis} · тягне: ${gizmo.dragging ? 'так' : 'ні'} · режим: ${MODE_NAMES[gizmo.mode]}${lastNote ? ` · ${lastNote}` : ''}\n` +
    `куб, мм:  X ${mm(p.x)}  Y ${mm(p.y)}  Z ${mm(p.z)}\n` +
    `зсув від дотику, мм:  X ${mm(p.x - touchStart.x)}  Y ${mm(p.y - touchStart.y)}  Z ${mm(p.z - touchStart.z)}\n` +
    `поворот °: ${deg(r.x)} ${deg(r.y)} ${deg(r.z)} · масштаб: ${s.x.toFixed(2)} ${s.y.toFixed(2)} ${s.z.toFixed(2)}` +
    (window.__errors.length ? `\nПОМИЛКА: ${window.__errors.join(' | ')}` : '');
}

// ---- frame loop -----------------------------------------------------------------
function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
}
window.addEventListener('resize', resize);
resize();

function frame() {
  requestAnimationFrame(frame);
  renderer.render(scene, camera);
  renderDebug();
}
frame();

// For checking from the browser console / automated checks.
window.__gizmoTest = { THREE, scene, camera, cube, gizmo, orbit, renderDebug, buildReport, CUBE_START };
</script>
</body>
</html>
