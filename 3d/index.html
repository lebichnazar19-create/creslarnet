<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Creslarnet — 3D режим</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#8338ec">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creslarnet">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="style.css">

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <a href="../index.html" class="back-link" title="Повернутись до 2D-режиму">← 2D</a>
  <button id="resetViewBtn" class="back-link reset-view-btn" title="Скинути камеру до початкового вигляду">⌂ Початковий вигляд</button>

  <div id="crosshair" class="crosshair hidden" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 4v6M12 14v6M4 12h6M14 12h6"/></svg>
  </div>

  <!-- Dolly forward/back straight along the camera's own view direction —
       see wireZoomButton in app.js. -->
  <div id="zoomControl" class="zoom-control">
    <button id="zoomInBtn" title="Наблизити">+</button>
    <button id="zoomOutBtn" title="Віддалити — побачити більше, наприклад, всю стіну">−</button>
  </div>

  <!-- Room minimap — top-down floor plan with a dot for the camera and a
       wedge for which way it's facing. Only shown while actually standing
       inside a room (see updateMinimap in app.js). -->
  <div id="minimapWrap" class="minimap-wrap hidden">
    <canvas id="minimapCanvas" width="200" height="200"></canvas>
    <span id="minimapCoords" class="minimap-coords"></span>
  </div>

  <!-- Own dedicated corner button (not sharing the crowded bottom toolbar
       row) — tap to start/stop drawing a free 3D polyline. -->
  <button id="spatialLineFab" class="fab fab-spatialline" title="Просторова лінія">
    <svg viewBox="0 0 24 24"><path d="M4 18 L9 8 L14 15 L20 5"/><circle cx="4" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="9" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="14" cy="15" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="5" r="1.6" fill="currentColor" stroke="none"/></svg>
  </button>

  <button id="walkExit" class="walk-exit hidden">✕ Вихід із прогулянки</button>

  <div id="toast" class="toast hidden"></div>

  <div id="scaleBar" class="scale-bar" aria-hidden="true">
    <div id="scaleBarFill" class="scale-bar-fill"></div>
    <span id="scaleBarLabel" class="scale-bar-label">—</span>
  </div>

  <!-- Engineering-style dimension lines (arrow-to-arrow + mm label) spanning
       the selected object's own X/Y/Z extents -->
  <svg id="dimensionOverlay" class="dimension-overlay">
    <defs>
      <marker id="dimArrowX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#d83e3e"></path>
      </marker>
      <marker id="dimArrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#3a6cd8"></path>
      </marker>
      <marker id="dimArrowZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#3aa85a"></path>
      </marker>
    </defs>
    <g id="dimGroupX" class="dim-group hidden">
      <line class="dim-line dim-line-x" marker-start="url(#dimArrowX)" marker-end="url(#dimArrowX)"></line>
      <text class="dim-text dim-text-x"></text>
    </g>
    <g id="dimGroupY" class="dim-group hidden">
      <line class="dim-line dim-line-y" marker-start="url(#dimArrowY)" marker-end="url(#dimArrowY)"></line>
      <text class="dim-text dim-text-y"></text>
    </g>
    <g id="dimGroupZ" class="dim-group hidden">
      <line class="dim-line dim-line-z" marker-start="url(#dimArrowZ)" marker-end="url(#dimArrowZ)"></line>
      <text class="dim-text dim-text-z"></text>
    </g>
    <!-- One <g class="hole-label"> per cut hole on the selected object,
         built/recycled in app.js's updateHoleLabels(). -->
    <g id="holeLabelsGroup"></g>
    <!-- Width/height callouts for every tile cut down from the standard
         size — always on, not gated by selection, built in
         updateTileCutLabels(). -->
    <g id="tileCutLabelsGroup"></g>
    <!-- Live segment-length readout while dragging a "Просторова лінія"
         gizmo arrow — see updateSpatialLineLengthLabel(). -->
    <g id="spatialLineLengthGroup" class="dim-group hidden">
      <line class="dim-line spatial-line-length-line"></line>
      <text class="dim-text spatial-line-length-text"></text>
    </g>
    <!-- One <g class="pipe-run-label"> per converted pipe/wire/rebar run
         from "Просторова лінія" — always on, built in
         updateSpatialLineTypeLabels(). -->
    <g id="spatialLineLabelsGroup"></g>
  </svg>

  <!-- Selection contextual panel (shown when an object is picked) -->
  <div id="selectionPanel" class="panel selection-panel hidden"></div>

  <!-- Transient pill shown during move-drag / hole-placement sub-modes -->
  <div id="modePill" class="mode-pill hidden"></div>

  <!-- Popovers opened from the bottom toolbar -->
  <div id="popover" class="panel popover hidden"></div>

  <nav id="toolbar" class="toolbar">
    <button class="tb-btn" data-panel="objects" title="Об'єкти">
      <svg viewBox="0 0 24 24"><path d="M4 8 L12 4 L20 8 L20 16 L12 20 L4 16 Z M4 8 L12 12 L20 8 M12 12 L12 20"/></svg>
      <span>Об'єкти</span>
    </button>
    <button class="tb-btn" data-panel="room" title="Кімната">
      <svg viewBox="0 0 24 24"><path d="M4 20 V8 L12 3 L20 8 V20 Z M4 20 H20 M4 8 H20"/></svg>
      <span>Кімната</span>
    </button>
    <button class="tb-btn" data-panel="walls" title="Стіни">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M3 9 H21 M3 14 H21 M8 4 V9 M14 9 V14 M8 14 V19 M16 4 V9 M12 14 V19"/></svg>
      <span>Стіни</span>
    </button>
    <button class="tb-btn" data-panel="tile3d" title="Плитка">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
      <span>Плитка</span>
    </button>
    <button class="tb-btn" data-panel="windows" title="Вікна">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4 V20 M4 12 H20"/></svg>
      <span>Вікна</span>
    </button>
    <button class="tb-btn" id="walkToggle" title="Прогулянка від першої особи">
      <svg viewBox="0 0 24 24"><ellipse cx="9" cy="7" rx="2.4" ry="3.4" transform="rotate(-18 9 7)"/><ellipse cx="15" cy="16" rx="2.4" ry="3.4" transform="rotate(18 15 16)"/></svg>
      <span>Прогулянка</span>
    </button>
    <button class="tb-btn" data-panel="file" title="Файл">
      <svg viewBox="0 0 24 24"><path d="M4 4 H16 L20 8 V20 H4 Z M8 4 V9 H15 V4 M8 20 V14 H16 V20"/></svg>
      <span>Файл</span>
    </button>
  </nav>

  <input type="file" id="fileInput" accept="application/json,.json" class="hidden">

  <script type="module" src="app.js"></script>
</body>
</html>
