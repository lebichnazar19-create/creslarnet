<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Creslarnet — прототип 2D</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8338ec">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creslarnet">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The sheet fills the whole screen — everything else is a floating
       overlay or a slide-in drawer, never something that resizes/reflows
       the canvas itself (that's what kept the sheet "wandering" before). -->
  <canvas id="drawCanvas"></canvas>

  <div class="scale-bar-2d" aria-hidden="true">
    <div id="scaleBarFill2d" class="scale-bar-fill-2d"></div>
    <span id="scaleBarLabel2d" class="scale-bar-label-2d">—</span>
  </div>

  <div class="chain-bar hidden" id="chainBar2d">
    <button id="chainUndoBtn" title="Скасувати останню точку">⌫ Точка</button>
    <button id="chainCancelBtn" title="Скасувати всю полілінію">✕ Скасувати</button>
    <button id="chainDoneBtn" title="Завершити полілінію">✓ Завершити</button>
  </div>

  <p class="hint-toast" id="canvasHint" aria-hidden="true"></p>

  <!-- Both drawers stay hidden until their own button is tapped, and the
       tools drawer closes itself again the moment a tool is picked — see
       the "Panel not permanently expanded" requirement. -->
  <button id="projectFabBtn" class="fab fab-left" title="Проект і сторінки">📁</button>
  <button id="toolsFabBtn" class="fab fab-right" title="Інструменти">🛠️</button>

  <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>

  <aside class="drawer drawer-right" id="toolsDrawer">
    <div class="drawer-header">
      <h2>Інструменти</h2>
      <button class="drawer-close" id="toolsDrawerClose" title="Закрити">✕</button>
    </div>
    <div class="drawer-body">
      <div class="tool-group">
        <h2>Інструменти</h2>
        <button class="tool-btn active" data-tool="select" title="Виділити / перемістити / панорамувати">
          <svg viewBox="0 0 24 24"><path d="M6 3 L6 19 L10 15 L13 21 L15.5 20 L12.5 14 L18 14 Z"/></svg>
          Виділити
        </button>
        <button class="tool-btn" data-tool="line" title="Лінія">
          <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4"/></svg>
          Лінія
        </button>
        <button class="tool-btn" data-tool="rect" title="Прямокутник">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
          Прямокутник
        </button>
        <button class="tool-btn" data-tool="circle" title="Коло">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
          Коло
        </button>
        <button class="tool-btn" data-tool="arc" title="Дуга / циркуль">
          <svg viewBox="0 0 24 24"><path d="M4 18 A8 8 0 0 1 20 18"/></svg>
          Дуга
        </button>
        <button class="tool-btn" data-tool="freehand" title="Олівець — довільна пряма чи крива лінія від руки">
          <svg viewBox="0 0 24 24"><path d="M4 20 Q9 6 12 13 T20 4"/></svg>
          Олівець
        </button>
        <button class="tool-btn" data-tool="polyline" title="Полілінія — ланцюжок прямих сегментів: тягни й відпускай, кожен сегмент фіксується і продовжується наступним">
          <svg viewBox="0 0 24 24"><path d="M3 19 L9 9 L14 15 L21 5"/><circle cx="3" cy="19" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="9" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="15" r="1.4" fill="currentColor" stroke="none"/><circle cx="21" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>
          Полілінія
        </button>
        <button class="tool-btn" data-tool="leader" title="Виноска — підпис до деталі">
          <svg viewBox="0 0 24 24"><path d="M4 20 L10 14 L10 10 L20 10"/><circle cx="4" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
          Виноска
        </button>
        <button class="tool-btn" data-tool="eraser" title="Ластик — провести по фігурі, щоб стерти">
          <svg viewBox="0 0 24 24"><path d="M3 17 L13 7 L20 14 L13 21 L7 21 Z"/><line x1="9" y1="11" x2="16" y2="18"/></svg>
          Ластик
        </button>
        <button class="tool-btn" data-tool="tilearea" title="Плитка — задайте приміщення, розмір плитки й фото, отримайте розкладку">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
          Плитка
        </button>
      </div>

      <div class="tool-group">
        <h2>Формат листа</h2>
        <div class="page-size-options">
          <button class="page-size-btn active" data-page-size="A4">А4</button>
          <button class="page-size-btn" data-page-size="A3">А3</button>
          <button class="page-size-btn" data-page-size="A2">А2</button>
          <button class="page-size-btn" data-page-size="A1">А1</button>
        </div>
      </div>

      <div class="tool-group" id="dimPanel2d">
        <!-- filled dynamically when a shape is selected -->
      </div>

      <div class="tool-group">
        <h2>Колір</h2>
        <div class="colors">
          <button class="color-swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></button>
          <button class="color-swatch" data-color="#e63946" style="background:#e63946"></button>
          <button class="color-swatch" data-color="#2a9d8f" style="background:#2a9d8f"></button>
          <button class="color-swatch" data-color="#264653" style="background:#264653"></button>
          <button class="color-swatch" data-color="#f4a261" style="background:#f4a261"></button>
          <button class="color-swatch" data-color="#8338ec" style="background:#8338ec"></button>
        </div>
        <label class="custom-color-label">
          Свій колір
          <input type="color" id="customColor" value="#1a1a1a">
        </label>
      </div>

      <div class="tool-group">
        <h2>Товщина лінії</h2>
        <input type="range" id="lineWidth" min="1" max="20" value="3">
        <span id="lineWidthValue">3 px</span>
      </div>

      <div class="tool-group">
        <h2>Проєкт-файл</h2>
        <button class="action-btn" id="saveProjectBtn2d">⭳ Зберегти проєкт у файл</button>
        <button class="action-btn" id="loadProjectBtn2d">⭱ Відкрити проєкт з файлу</button>
      </div>

      <div class="tool-group">
        <h2>Дії</h2>
        <button class="action-btn" id="undoBtn">Скасувати</button>
        <button class="action-btn" id="clearBtn">Очистити полотно</button>
        <button class="action-btn" id="exportBtn">Зберегти як PNG</button>
        <button class="action-btn" id="printBtn">🖨 Друк</button>
        <button class="action-btn" id="scanBtn">📷 Скан малюнка з фото</button>
        <a href="3d/index.html" class="action-btn mode-link-btn">🧊 3D-режим →</a>
      </div>
    </div>
  </aside>

  <input type="file" accept="application/json,.json" id="projectFileInput2d" class="hidden">

  <aside class="drawer drawer-left" id="projectDrawer">
    <div class="drawer-header">
      <h2>Проект</h2>
      <button class="drawer-close" id="projectDrawerClose" title="Закрити">✕</button>
    </div>
    <div class="drawer-body" id="projectDrawerBody">
      <!-- filled dynamically: "create project" form, or the project's name,
           page list and jump-to-page field once one exists -->
    </div>
  </aside>

  <input type="file" accept="image/*" id="tilePhotoInput" class="hidden">
  <!-- No `capture` attribute here on purpose — that forces the camera app
       straight open on most mobile browsers, skipping the gallery/file
       choice entirely. Plain accept="image/*" lets the OS show its normal
       picker (camera or an existing photo). -->
  <input type="file" accept="image/*" id="scanPhotoInput" class="hidden">

  <div id="scanModal" class="scan-modal hidden">
    <div class="scan-modal-inner">
      <div class="scan-modal-header">
        <h3>Скан малюнка з фото</h3>
        <button id="scanCloseBtn" class="scan-close-x" title="Закрити">✕</button>
      </div>
      <p class="scan-hint">Перетягніть 4 точки на кути аркуша паперу на фото — це вирівняє перспективу.</p>
      <canvas id="scanPhotoCanvas" class="scan-photo-canvas"></canvas>

      <label class="scan-sensitivity-label">
        Чутливість розпізнавання ліній
        <input type="range" id="scanSensitivity" min="0" max="100" value="50">
      </label>
      <label class="scan-straighten-label">
        <input type="checkbox" id="scanStraighten" checked>
        Вирівняти лінії — прибрати нерівності й розпрямити майже прямі відрізки
      </label>
      <p class="scan-hint">Попередній перегляд — чорне стане векторними лініями:</p>
      <canvas id="scanPreviewCanvas" class="scan-preview-canvas"></canvas>

      <p id="scanStatus" class="scan-status"></p>
      <div class="scan-modal-actions">
        <button id="scanCancelBtn" class="action-btn ghost">Скасувати</button>
        <button id="scanCommitBtn" class="action-btn primary">✓ Зберегти на аркуш</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
